services:
  classification:
    restart: unless-stopped
    build:
      context: .
      args:
        - HOST_MODEL_PATH=good-model-2.tflite

    environment:
      - MIN_CONFIDENCE_PERCENT=70
      - MIN_REPRESENTANT_CONFIDENCE_PERCENT=65
      - MODEL_LABELS=BC,BE,BhBl,BlBh,None,Unfinished,XB

    ports:
      - "8000:8000"

    networks:
      - strnadi-ai
  
networks:
  strnadi-ai:
    external: true
    name: strnadi-ai
